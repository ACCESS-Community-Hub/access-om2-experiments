description: |-
  1 degree ACCESS-OM2 global model configuration under repeat-decade forcing
  (RDF, 1962-1971), run as a three-stage pre-industrial (PI) spin-up and ramp,
  following a similar process to Huguenin, Holmes & England (2022). The
  configuration is based on that described in Kiss et al. (2020),
  https://doi.org/10.5194/gmd-13-401-2020, but with many improvements and
  WOMBATlite ocean biogeochemistry. Initial conditions are WOA13v2 conservative
  temperature and practical salinity. Initial BGC tracer concentrations are the
  same as the legacy WOMBAT configuration "1deg_jra55_iaf_bgc" (see
  https://github.com/COSIMA/input_om2-bgc/tree/9d28b5f) with the following
  additional WOMBATlite tracers:
  - pchl = phy * 0.02
  - phyfe = phy * 7e-6
  - zoofe = zoo * 7e-6
  - detfe = det * 7e-6
  - dicp = 0.0
  - dicr = 0.0
  - detfe_sediment = 0.0
  Run with JRA55-do v1.6.0 RDF forcing (repeating 1962-1971 decade) with all
  solid runoff converted to liquid runoff with no heat transfer. Humidity is
  forced using relative humidity (rhuss) directly rather than specific humidity
  (huss), avoiding the need for an offline humidity-correction step when the
  temperature offset is applied.
  The experiment runs in three stages within a single continuous integration:
  - Stage 1 (experiment calendar 1962-3961, 2000 years): constant pre-industrial
  CO2 (278.00745 ppm) and constant pre-industrial (1750 baseline) forcing offsets
  are applied to bring the model to quasi-equilibrium under PI conditions:
  Δtas = −0.233°C and Δrlds = −0.8 W/m², applied uniformly in space and time.
  - Stage 2 (experiment calendar 1750-1871, 122 years): historical CO2
  forcing begins and ramps forward, while the PI forcing offsets (ΔTAS, ΔRLDS)
  remain held constant at their full Stage 1 magnitude.
  - Stage 3 (experiment calendar 1872-1961, 90 years): the PI forcing
  offsets are ramped linearly down from full magnitude to zero over this final
  90-year period, referenced to the experiment calendar so the ramp progresses
  monotonically across the underlying repeating RDF forcing decade, while
  historical CO2 forcing continues.
